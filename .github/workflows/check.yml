name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scripts compile
        run: python -m py_compile scripts/*.py

      - name: Page scripts parse
        run: for f in site/assets/*.js; do node --check "$f" || exit 1; done

      - name: News feed reads ESPN (dry run, writes nothing)
        run: python scripts/update_news.py --dry-run

      - name: UFC upcoming card reads ESPN or UFCStats (writes nothing)
        run: |
          pip install --quiet pandas
          python scripts/update_props_ufc.py --check

      - name: Soccer schedules and match summaries read ESPN (writes nothing)
        run: python scripts/update_props_soccer.py --check

      - name: Cricket reads Cricsheet and ESPN's schedule (writes nothing)
        run: python scripts/update_props_cricket.py --check

      - name: Full soccer and cricket build, model and best bets (temporary end-to-end run)
        run: |
          pip install --quiet pyarrow lightgbm
          time python scripts/update_props_soccer.py
          time python scripts/update_props_cricket.py
          time python scripts/train_props_model.py soc cri
          python scripts/best_bets.py | grep -E "soc|cri"
          python - <<'PY'
          import json
          b = json.load(open("site/data/props/best.json"))
          for sp in ("soc", "cri"):
              s = b["sports"].get(sp, {})
              print(sp, s.get("slate"), s.get("games"), s.get("note"))
              for c in s.get("picks", [])[:5]: print("  ", c["name"], c["team"], c["side"], c["line"], c["key"], c["p"])
              for p in s.get("parlays", [])[:1]: print("  parlay", p)
          for sp in ("soc", "cri"):
              m = json.load(open(f"site/data/props/{sp}/model.json"))
              print(sp, "model used", m["used"], m["report"]["default_lines"]["trained"], m["report"]["default_lines"]["formula"])
              i = json.load(open(f"site/data/props/{sp}/index.json"))
              print(sp, len(i["players"]), "players;", i["players"][:4], list(i["next"].items())[:2])
          PY
