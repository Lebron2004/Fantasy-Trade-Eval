name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scripts compile
        run: python -m py_compile scripts/*.py

      - name: Page scripts parse
        run: for f in site/assets/*.js; do node --check "$f" || exit 1; done

      - name: News feed reads ESPN (dry run, writes nothing)
        run: python scripts/update_news.py --dry-run

      - name: UFC upcoming card reads ESPN or UFCStats (writes nothing)
        run: |
          pip install --quiet pandas
          python scripts/update_props_ufc.py --check

      - name: Soccer schedules and match summaries read ESPN (writes nothing)
        run: python scripts/update_props_soccer.py --check

      - name: Cricket reads Cricsheet and ESPN's schedule (writes nothing)
        run: python scripts/update_props_cricket.py --check

      - name: Full cricket build, model and best bets (temporary end-to-end run)
        run: |
          pip install --quiet pyarrow lightgbm
          python scripts/update_props_cricket.py
          python scripts/train_props_model.py cri
          python scripts/best_bets.py | grep -E "cri"
          python - <<'PY'
          import json
          s = json.load(open("site/data/props/best.json"))["sports"].get("cri", {})
          print(s.get("slate"), s.get("games"), s.get("note"))
          for c in s.get("picks", [])[:8]: print("  ", c["name"], c["team"], c["side"], c["line"], c["key"], c["p"])
          i = json.load(open("site/data/props/cri/index.json"))
          print(len(i["players"]), "players;", i["players"][:8])
          PY
