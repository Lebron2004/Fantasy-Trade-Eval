name: Update players and deploy

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/*.html", "site/assets/**", "scripts/**", "leagues.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull latest players, values and team changes
        run: python scripts/update_players.py

      # finished soccer matches never change, so their lineups are fetched once and carried between runs
      - name: Restore soccer match cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: props-cache-${{ github.run_id }}
          restore-keys: props-cache-

      - name: Build props data (NFL, NBA, NHL, MLB, college football and basketball, UFC, soccer, cricket)
        continue-on-error: true
        run: |
          pip install --quiet pandas pyarrow
          python scripts/update_props.py || echo "NFL props failed"
          python scripts/update_props_more.py || echo "NBA, NHL or MLB props failed"
          python scripts/update_props_college.py || echo "College props failed"
          python scripts/update_props_ufc.py || echo "UFC props failed"
          python scripts/update_props_soccer.py || echo "Soccer props failed"
          python scripts/update_props_cricket.py

      - name: Save soccer match cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: props-cache-${{ github.run_id }}

      - name: Train the prop model on past games
        continue-on-error: true
        timeout-minutes: 50
        run: |
          pip install --quiet lightgbm
          python scripts/train_props_model.py

      - name: Turn the model's predictions into buy and sell signals for trades
        continue-on-error: true
        run: python scripts/trade_signals.py

      - name: Pick the day's best bets and parlays
        continue-on-error: true
        run: python scripts/best_bets.py

      - name: Sync ESPN and Yahoo leagues
        continue-on-error: true
        run: python scripts/sync_leagues.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}

      - name: Pull player news (injury changes, team changes, ESPN notes)
        continue-on-error: true
        run: python scripts/update_news.py

      - name: Commit refreshed data
        run: |
          git config user.name "trade-scale-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "site/data/props/" >> .git/info/exclude
          git rm -r -q --cached --ignore-unmatch site/data/props
          git add site/data
          if [ -f site/data/props/mlb/_cache.json ]; then git add -f site/data/props/mlb/_cache.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Player data $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
